<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MediCheck{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 760px; margin: 0 auto; padding: 24px;
      background: #f7f7f8; color: #1f2937; line-height: 1.5;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb;
    }
    h1 { margin: 0; font-size: 22px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    h3 { font-size: 14px; margin: 16px 0 4px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
    .doctor-name { font-size: 14px; color: #6b7280; }
    .card {
      background: white; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 16px; margin-bottom: 12px;
    }
    .card a { text-decoration: none; color: #2563eb; font-weight: 500; }
    .meta { color: #6b7280; font-size: 13px; }
    label { display: block; margin: 12px 0 6px; font-weight: 500; font-size: 14px; }
    input[type=text], textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; font-family: inherit; background: white;
    }
    textarea { min-height: 80px; resize: vertical; }
    button, input[type=submit] {
      background: #2563eb; color: white; border: 0;
      padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-size: 14px; font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    .verdict-options { display: flex; gap: 12px; margin-top: 8px; }
    .verdict-options label {
      display: flex; align-items: center; gap: 8px; padding: 12px;
      border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer;
      flex: 1; margin: 0; font-weight: 500;
    }
    .verdict-options label:hover { border-color: #93c5fd; }
    .verdict-options input { margin: 0; }
    .empty { text-align: center; color: #6b7280; padding: 40px 0; }
    .file-list a {
      display: inline-block; padding: 6px 10px; background: #f3f4f6;
      border-radius: 4px; margin: 4px 4px 0 0; font-size: 13px;
    }
    fieldset { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; }
    fieldset legend { font-weight: 500; padding: 0 6px; color: #6b7280; }
    .back-link { font-size: 14px; color: #6b7280; text-decoration: none; }
    .back-link:hover { color: #2563eb; }
  </style>
</head>
<body>
  <header>
    <h1>🩺 MediCheck — Painel Médico</h1>
    <span class="doctor-name">{{ doctor.name }} • {{ doctor.specialty }}</span>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
